<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Hospital Anomaly — ระบบรับผู้ป่วย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0f2e2b;
    --bg-panel:#153c38;
    --bg-panel-2:#1a4642;
    --mint:#bfe8dd;
    --mint-dim:#8fc9ba;
    --paper:#f6f1e4;
    --paper-line:#e3dac4;
    --coral:#e8734a;
    --coral-dim:#c85e39;
    --monitor-bg:#06140f;
    --monitor-green:#59f2a6;
    --ink:#16302c;
    --danger:#e85a5a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(1200px 800px at 20% -10%, #1a4a45 0%, var(--bg-deep) 60%);
    color:var(--mint);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    padding:24px;
  }
  .display-font{font-family:'Baloo 2',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    width:min(440px,92vw);
    background:var(--bg-panel);
    border:1px solid #2c5a54;
    border-radius:20px;
    padding:40px 32px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.4);
  }
  .cross{
    width:52px;height:52px;margin:0 auto 18px;
    position:relative;
  }
  .cross::before,.cross::after{
    content:'';position:absolute;background:var(--coral);border-radius:4px;
  }
  .cross::before{width:100%;height:16px;top:50%;transform:translateY(-50%);}
  .cross::after{height:100%;width:16px;left:50%;transform:translateX(-50%);}
  #login-screen h1{
    font-family:'Baloo 2',sans-serif;
    font-size:26px;font-weight:800;margin:0 0 4px;color:var(--paper);
    letter-spacing:.5px;
  }
  #login-screen p.sub{
    margin:0 0 28px;color:var(--mint-dim);font-size:13px;letter-spacing:1.5px;text-transform:uppercase;
  }
  #staff-name{
    width:100%;padding:14px 16px;border-radius:10px;border:1.5px solid #2c5a54;
    background:var(--bg-deep);color:var(--paper);font-size:16px;font-family:'Inter',sans-serif;
    outline:none;text-align:center;margin-bottom:16px;
  }
  #staff-name:focus{border-color:var(--coral);}
  #enter-btn{
    width:100%;padding:14px;border-radius:10px;border:none;
    background:var(--coral);color:#1b1b1b;font-weight:700;font-size:15px;
    cursor:pointer;letter-spacing:.5px;transition:transform .1s, background .15s;
    font-family:'Baloo 2',sans-serif;
  }
  #enter-btn:hover{background:#f08659;}
  #enter-btn:active{transform:scale(.97);}
  #enter-btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- KIOSK ---------- */
  #kiosk{
    display:none;
    width:min(1080px,96vw);
    gap:20px;
  }
  .kiosk-grid{
    display:grid;
    grid-template-columns:1.5fr 1fr;
    gap:20px;
  }
  @media (max-width:820px){ .kiosk-grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--bg-panel);
    border:1px solid #2c5a54;
    border-radius:18px;
    padding:22px 24px;
    position:relative;
    overflow:hidden;
  }
  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;font-size:13px;color:var(--mint-dim);
  }
  .topbar .staff{color:var(--paper);font-weight:600;}
  .queue-badge{
    background:var(--bg-panel-2);border:1px solid #2c5a54;border-radius:999px;
    padding:6px 14px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--monitor-green);
  }

  /* Main stage */
  #stage{
    min-height:380px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:18px;position:relative;
  }
  .stage-title{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;color:var(--paper);}
  .stage-hint{
    font-size:13px;color:var(--mint-dim);
  }
  .keycap{
    display:inline-block;background:var(--bg-deep);border:1px solid #3a6b64;
    border-bottom:3px solid #3a6b64;
    padding:3px 12px;border-radius:6px;font-family:'JetBrains Mono',monospace;
    color:var(--monitor-green);font-weight:700;font-size:13px;
    transition:transform .06s, border-bottom-width .06s;
  }
  .keycap.pressed{transform:translateY(2px);border-bottom-width:1px;}

  /* Admission card / stamp */
  #admit-card{
    width:280px;min-height:170px;background:var(--paper);border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);position:relative;
    padding:18px;color:var(--ink);text-align:left;
    background-image:repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px);
  }
  #admit-card .field{font-family:'JetBrains Mono',monospace;font-size:12px;margin-bottom:4px;color:#5a4d38;}
  #admit-card .field b{color:var(--ink);}
  #stamp-mark{
    position:absolute;top:14px;right:14px;width:78px;height:78px;
    border:3px solid var(--coral);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--coral);font-family:'Baloo 2',sans-serif;font-weight:800;font-size:11px;
    transform:rotate(-14deg) scale(0);opacity:0;text-align:center;line-height:1.15;
    transition:transform .18s cubic-bezier(.2,1.4,.4,1), opacity .12s;
    mix-blend-mode:multiply;
  }
  #stamp-mark.show{transform:rotate(-14deg) scale(1);opacity:.88;}
  #sign-line{
    position:absolute;bottom:16px;left:18px;right:18px;height:34px;
    border-top:1px solid #b9ac8a;
  }
  #sign-svg-path{
    fill:none;stroke:#233;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  }

  /* Camera */
  #cam-wrap{
    width:320px;height:240px;border-radius:12px;overflow:hidden;background:#000;
    position:relative;border:3px solid var(--bg-panel-2);
  }
  #cam-video, #cam-canvas, #cam-photo{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  #cam-canvas{display:none;}
  #cam-photo{display:none;}
  .flash{
    position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;
  }
  .flash.go{animation:flashpop .35s ease-out;}
  @keyframes flashpop{0%{opacity:.95;}100%{opacity:0;}}
  .rec-dot{
    position:absolute;top:10px;left:10px;width:9px;height:9px;border-radius:50%;
    background:var(--danger);box-shadow:0 0 8px var(--danger);
    animation:blink 1.1s infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

  .pet-tag{
    background:var(--bg-panel-2);border:1px solid #2c5a54;border-radius:12px;
    padding:12px 16px;text-align:left;width:320px;
  }
  .pet-tag .name{font-family:'Baloo 2',sans-serif;font-size:18px;color:var(--paper);font-weight:700;}
  .pet-tag .species{font-size:12px;color:var(--mint-dim);margin-top:2px;}

  /* Processing */
  #progress-wrap{width:300px;}
  #progress-track{
    width:100%;height:14px;background:var(--bg-deep);border-radius:999px;overflow:hidden;
    border:1px solid #2c5a54;
  }
  #progress-fill{
    height:100%;width:0%;background:linear-gradient(90deg,var(--coral),var(--monitor-green));
    border-radius:999px;transition:width .15s linear;
  }
  #progress-pct{font-family:'JetBrains Mono',monospace;font-size:22px;color:var(--monitor-green);margin-top:10px;}

  /* Ticket */
  #ticket{
    width:260px;background:var(--paper);color:var(--ink);border-radius:4px;
    padding:18px 16px 22px;font-family:'JetBrains Mono',monospace;font-size:12.5px;
    box-shadow:0 14px 34px rgba(0,0,0,.4);
    clip-path:polygon(0 0,100% 0,100% 96%,95% 100%,90% 96%,85% 100%,80% 96%,75% 100%,70% 96%,65% 100%,60% 96%,55% 100%,50% 96%,45% 100%,40% 96%,35% 100%,30% 96%,25% 100%,20% 96%,15% 100%,10% 96%,5% 100%,0 96%);
    transform:translateY(-140px);opacity:0;transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .3s;
  }
  #ticket.printed{transform:translateY(0);opacity:1;}
  #ticket .t-title{font-weight:700;font-size:14px;text-align:center;letter-spacing:2px;border-bottom:1px dashed #999;padding-bottom:8px;margin-bottom:8px;}
  #ticket .t-row{display:flex;justify-content:space-between;margin-bottom:5px;}
  #ticket .t-queue{
    text-align:center;font-size:30px;font-weight:700;margin:10px 0;letter-spacing:1px;
  }
  #ticket .t-foot{border-top:1px dashed #999;padding-top:8px;margin-top:8px;text-align:center;color:#7a7160;font-size:10.5px;}

  /* Care Items Display */
  #care-items-box{
    width:320px;background:var(--bg-panel);border:2px solid var(--coral);border-radius:14px;
    padding:20px;box-shadow:0 16px 40px rgba(0,0,0,.4);
  }
  .care-patient{background:var(--bg-panel-2);border-radius:10px;padding:14px;margin-bottom:16px;text-align:center;}
  .care-name{font-family:'Baloo 2',sans-serif;font-size:22px;font-weight:700;color:var(--paper);margin-bottom:4px;}
  .care-species{font-size:12px;color:var(--mint-dim);}
  .care-items-list{background:rgba(0,0,0,.25);border-radius:8px;padding:14px;border-left:3px solid var(--monitor-green);}
  .item-header{font-family:'Baloo 2',sans-serif;font-size:12px;font-weight:700;color:var(--monitor-green);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
  .item-text{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--paper);line-height:1.5;font-weight:500;}

  /* Monitor sidebar */
  #monitor-panel{
    background:var(--monitor-bg);
    border:1px solid #12332a;
  }
  #monitor-panel .topbar{color:#3a7a63;}
  #monitor-panel .topbar .staff{color:var(--monitor-green);}
  .monitor-screen{
    border:1px solid #12332a;border-radius:8px;padding:16px;min-height:300px;
    font-family:'JetBrains Mono',monospace;color:var(--monitor-green);
    background:repeating-linear-gradient(180deg, rgba(89,242,166,.02) 0 2px, transparent 2px 4px);
  }
  .monitor-screen .mline{font-size:12px;color:#3a9a78;margin-bottom:6px;}
  .monitor-screen .mval{font-size:15px;color:var(--monitor-green);margin-bottom:14px;font-weight:700;}
  .monitor-need{
    margin-top:10px;border:1px dashed #2a6b52;border-radius:8px;padding:12px;
  }
  .monitor-need .mlabel{font-size:11px;color:#3a9a78;letter-spacing:1.5px;margin-bottom:6px;}
  .monitor-need .mtext{font-size:16px;color:#ffd27a;font-weight:700;}
  .blinker{animation:blink 1s infinite;}
  .empty-msg{color:#2a6b52;font-size:12px;text-align:center;margin-top:40px;}

  .footer-hint{
    text-align:center;margin-top:16px;font-size:12px;color:var(--mint-dim);
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="cross"></div>
  <h1>Animal Hospital Anomaly</h1>
  <p class="sub">ระบบรับผู้ป่วยสัตว์ประจำเวร</p>
  <input id="staff-name" type="text" placeholder="ชื่อเจ้าหน้าที่" maxlength="24" autocomplete="off">
  <button id="enter-btn" disabled>เข้าเวร</button>
</div>

<!-- KIOSK -->
<div id="kiosk">
  <div class="kiosk-grid">
    <div class="panel" id="main-panel">
      <div class="topbar">
        <div>เจ้าหน้าที่: <span class="staff" id="hdr-staff">—</span></div>
        <div class="queue-badge" id="hdr-queue">คิวถัดไป: 001</div>
      </div>
      <div id="stage"></div>
      <div class="footer-hint" id="footer-hint">กด <span class="keycap" id="kc1">Space</span> เพื่อเริ่ม</div>
    </div>

    <div class="panel" id="monitor-panel">
      <div class="topbar">
        <div>MONITOR</div>
        <div class="staff" id="mon-time">--:--</div>
      </div>
      <div class="monitor-screen" id="monitor-screen">
        <div class="empty-msg">รอเคสถัดไป…</div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  /* ---------------- audio ---------------- */
  let actx;
  function ac(){ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function envGain(ctx, t0, peak, atk, dec){
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+atk+dec);
    return g;
  }
  function noiseBuffer(ctx, dur){
    const n = ctx.sampleRate*dur;
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    return buf;
  }
  function sKeyClick(){
    const ctx = ac(); const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type="square"; o.frequency.value=1500;
    const g = envGain(ctx,t0,.05,.001,.03);
    o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+.05);
  }
  function sStamp(){
    const ctx = ac(); const t0 = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx,.12);
    const lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=400;
    const g = envGain(ctx,t0,.6,.002,.15);
    src.connect(lp).connect(g).connect(ctx.destination); src.start(t0);
    const o = ctx.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(120,t0);
    o.frequency.exponentialRampToValueAtTime(40,t0+.15);
    const g2 = envGain(ctx,t0,.5,.001,.18);
    o.connect(g2).connect(ctx.destination); o.start(t0); o.stop(t0+.2);
  }
  function sSign(){
    const ctx = ac(); const dur=.9; const t0 = ctx.currentTime;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx,dur);
    const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=2200; bp.Q.value=.6;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0,t0);
    for(let i=0;i<6;i++){
      const tt = t0 + i*.14;
      g.gain.linearRampToValueAtTime(.12, tt+.03);
      g.gain.linearRampToValueAtTime(.01, tt+.11);
    }
    src.connect(bp).connect(g).connect(ctx.destination); src.start(t0); src.stop(t0+dur);
  }
  function sShutter(){
    const ctx = ac(); const t0 = ctx.currentTime;
    [0,.09].forEach(off=>{
      const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx,.05);
      const hp = ctx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=1800;
      const g = envGain(ctx,t0+off,.7,.001,.05);
      src.connect(hp).connect(g).connect(ctx.destination); src.start(t0+off);
    });
  }
  function sBeep(freq=880, dur=.05, vol=.15){
    const ctx = ac(); const t0 = ctx.currentTime;
    const o = ctx.createOscillator(); o.type="sine"; o.frequency.value=freq;
    const g = envGain(ctx,t0,vol,.002,dur);
    o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+dur+.02);
  }
  function sPrint(){
    const ctx = ac(); const t0 = ctx.currentTime; const dur=.7;
    const src = ctx.createBufferSource(); src.buffer = noiseBuffer(ctx,dur);
    const bp = ctx.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=1500; bp.Q.value=1.2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(.001,t0);
    for(let i=0;i<10;i++){
      const tt = t0+i*.06;
      g.gain.linearRampToValueAtTime(.08,tt+.02);
      g.gain.linearRampToValueAtTime(.01,tt+.05);
    }
    src.connect(bp).connect(g).connect(ctx.destination); src.start(t0); src.stop(t0+dur);
    setTimeout(()=>sBeep(660,.08,.12), dur*1000);
  }

  /* ---------------- data pools ---------------- */
  const SPECIES = [
    {th:"สุนัข", en:"Canine"}, {th:"แมว", en:"Feline"}, {th:"กระต่าย", en:"Rabbit"},
    {th:"นกแก้ว", en:"Parrot"}, {th:"หนูแฮมสเตอร์", en:"Hamster"}, {th:"เต่า", en:"Tortoise"},
    {th:"เฟอร์เร็ต", en:"Ferret"}, {th:"อิเกวียน่า", en:"Iguana"}
  ];
  const NAME_POOL = [
    "โมจิ","ทาโร่","บุหงา","ลูกชิ้น","แป้ง","เจ้าโต","มะม่วง","ปูเป้","ข้าวปั้น","งับ",
    "เมฆ","ฟลัฟฟี่","ชิบะ","บอส","หมูหวาน","จิงจิง","โกโก้","น้ำหวาน","ทับทิม","อั๋น",
    "มิลค์","ซูชิ","ปลาทู","วุ้น","เต้าหู้","บิสกิต","คาราเมล","ลิงลิง","ก้อนเมฆ","แป๊ะ"
  ];
  const SYMPTOMS = [
    "ขาหน้าซ้ายเจ็บ เดินกะเผลก","ไข้สูง ซึมผิดปกติ","ผื่นคันบริเวณท้อง",
    "อาเจียนหลังกินอาหาร","หูอักเสบ มีกลิ่น","แผลถลอกที่หลัง","ท้องเสียต่อเนื่อง 2 วัน",
    "หายใจมีเสียงหวีด","ตาแดงมีขี้ตาผิดปกติ","น้ำหนักลดผิดปกติ","เล็บฉีก มีเลือดซึม",
    "เบื่ออาหาร ไม่ยอมขยับตัว"
  ];
  const NEEDS = [
    "ยาลดไข้", "น้ำเกลือ", "ผ้าพันแผล", "วัคซีนกระตุ้น", "ยาฆ่าเชื้อ",
    "อาหารเฉพาะทาง", "เอกซเรย์ตรวจกระดูก", "พักฟื้นในกรงสังเกตอาการ", "ยาหยอดตา", "ตัดเล็บและทำแผล"
  ];

  let usedNames = new Set();
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function uniqueName(){
    if(usedNames.size >= NAME_POOL.length) usedNames.clear();
    let n;
    do{ n = pick(NAME_POOL); } while(usedNames.has(n));
    usedNames.add(n);
    return n;
  }

  /* ---------------- state ---------------- */
  const S = {
    LOGIN:"login", MAIN:"main", STAMPED:"stamped", SIGNED:"signed",
    CAMERA:"camera", CAPTURED:"captured", PROCESSING:"processing", TICKET:"ticket", CARE_ITEMS:"care_items"
  };
  let state = S.LOGIN;
  let staffName = "";
  let queueNum = 1;
  let stream = null;
  let currentPatient = null;
  let busy = false; // block double-trigger during animations

  const stage = document.getElementById('stage');
  const footerHint = document.getElementById('footer-hint');
  const hdrStaff = document.getElementById('hdr-staff');
  const hdrQueue = document.getElementById('hdr-queue');
  const monitorScreen = document.getElementById('monitor-screen');
  const monTime = document.getElementById('mon-time');

  function updateClock(){
    const d = new Date();
    monTime.textContent = d.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
  }
  setInterval(updateClock, 1000); updateClock();

  function setHint(html){ footerHint.innerHTML = html; }
  function pressKeycapAnim(){
    document.querySelectorAll('.keycap').forEach(k=>{
      k.classList.add('pressed');
      setTimeout(()=>k.classList.remove('pressed'), 110);
    });
  }

  /* ---------------- login ---------------- */
  const nameInput = document.getElementById('staff-name');
  const enterBtn = document.getElementById('enter-btn');
  nameInput.addEventListener('input', ()=>{
    enterBtn.disabled = nameInput.value.trim().length === 0;
  });
  function doLogin(){
    if(nameInput.value.trim().length===0) return;
    staffName = nameInput.value.trim();
    sBeep(660,.06,.12); setTimeout(()=>sBeep(880,.08,.14),90);
    document.getElementById('login-screen').style.display='none';
    document.getElementById('kiosk').style.display='block';
    hdrStaff.textContent = staffName;
    goMain();
  }
  enterBtn.addEventListener('click', doLogin);
  nameInput.addEventListener('keydown', e=>{ if(e.code==='Enter') doLogin(); });

  /* ---------------- MAIN / admission card ---------------- */
  function goMain(){
    state = S.MAIN;
    hdrQueue.textContent = `คิวถัดไป: ${String(queueNum).padStart(3,'0')}`;
    stage.innerHTML = `
      <div class="stage-title">ใบเข้าเวร — ปั๊มตราอนุมัติ</div>
      <div id="admit-card">
        <div class="field">วันที่: <b>${new Date().toLocaleDateString('th-TH')}</b></div>
        <div class="field">เจ้าหน้าที่: <b>${staffName}</b></div>
        <div class="field">สถานะ: <b id="admit-status">รอปั๊มตรา</b></div>
        <div id="stamp-mark">APPROVED<br>รพ.สัตว์</div>
        <div id="sign-line">
          <svg width="100%" height="34" viewBox="0 0 240 34" preserveAspectRatio="none">
            <path id="sign-svg-path" d=""></path>
          </svg>
        </div>
      </div>
    `;
    setHint(`กด <span class="keycap" id="kc1">Space</span> เพื่อปั๊มตรา`);
  }

  function doStamp(){
    sStamp(); pressKeycapAnim();
    document.getElementById('stamp-mark').classList.add('show');
    document.getElementById('admit-status').textContent = 'ปั๊มตราแล้ว';
    state = S.STAMPED;
    setHint(`กด <span class="keycap" id="kc1">Space</span> เพื่อเซ็นชื่อ`);
  }

  const SIGN_PATH = "M5,20 C20,5 30,30 45,15 S70,2 85,18 S110,30 125,12 S150,4 165,20 S190,28 205,10 S225,22 235,16";
  function doSign(){
    sSign(); pressKeycapAnim();
    const path = document.getElementById('sign-svg-path');
    const len = 320;
    path.setAttribute('d', SIGN_PATH);
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = 'stroke-dashoffset .85s ease-in-out';
    path.style.strokeDashoffset = 0;
    document.getElementById('admit-status').textContent = 'เซ็นชื่อแล้ว — พร้อมรับเคส';
    state = S.SIGNED;
    setHint(`กด <span class="keycap" id="kc1">Space</span> เพื่อเปิดกล้องถ่ายรูปสัตว์ป่วย`);
  }

  /* ---------------- camera ---------------- */
  async function openCamera(){
    state = S.CAMERA;
    stage.innerHTML = `
      <div class="stage-title">ถ่ายรูปสัตว์ป่วยเข้าระบบ</div>
      <div id="cam-wrap">
        <video id="cam-video" autoplay playsinline muted></video>
        <canvas id="cam-canvas"></canvas>
        <img id="cam-photo" alt="captured">
        <div class="rec-dot" id="rec-dot"></div>
        <div class="flash" id="flash"></div>
      </div>
    `;
    setHint(`กำลังขอสิทธิ์กล้อง…`);
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}, audio:false});
      document.getElementById('cam-video').srcObject = stream;
      setHint(`กด <span class="keycap" id="kc1">Space</span> เพื่อถ่ายรูป`);
    }catch(err){
      setHint(`ไม่สามารถเข้าถึงกล้องได้ — กด <span class="keycap" id="kc1">Space</span> เพื่อข้ามและสุ่มเคส`);
    }
  }

  function capturePhoto(){
    sShutter(); pressKeycapAnim();
    document.getElementById('flash').classList.add('go');
    const video = document.getElementById('cam-video');
    const canvas = document.getElementById('cam-canvas');
    const photo = document.getElementById('cam-photo');
    let dataUrl = null;
    if(video && video.videoWidth){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0);
      dataUrl = canvas.toDataURL('image/png');
    }
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    if(video) video.style.display='none';
    if(dataUrl){ photo.src = dataUrl; photo.style.display='block'; }

    const sp = pick(SPECIES);
    currentPatient = {
      name: uniqueName(),
      species: sp,
      symptom: pick(SYMPTOMS),
      need: pick(NEEDS),
      queue: queueNum
    };

    setTimeout(()=>{
      const wrap = document.getElementById('cam-wrap');
      const tag = document.createElement('div');
      tag.className = 'pet-tag';
      tag.style.marginTop = '14px';
      tag.innerHTML = `
        <div class="name">${currentPatient.name}</div>
        <div class="species">สายพันธุ์: ${currentPatient.species.th} (${currentPatient.species.en})</div>
      `;
      wrap.insertAdjacentElement('afterend', tag);
      setHint(`กด <span class="keycap" id="kc1">Space</span> เพื่อยืนยันข้อมูล`);
      state = S.CAPTURED;
    }, 180);
  }

  /* ---------------- processing ---------------- */
  function startProcessing(){
    state = S.PROCESSING;
    stage.innerHTML = `
      <div class="stage-title">กำลังประมวลผลข้อมูลผู้ป่วย</div>
      <div id="progress-wrap">
        <div id="progress-track"><div id="progress-fill"></div></div>
        <div id="progress-pct">0%</div>
      </div>
    `;
    setHint(`โปรดรอสักครู่…`);
    const fill = document.getElementById('progress-fill');
    const pctEl = document.getElementById('progress-pct');
    let pct = 0;
    const totalMs = 6000;
    const stepMs = 60;
    const steps = totalMs/stepMs;
    let i = 0;
    const timer = setInterval(()=>{
      i++;
      pct = Math.min(100, Math.round((i/steps)*100));
      fill.style.width = pct+'%';
      pctEl.textContent = pct+'%';
      if(i%6===0) sBeep(500+pct*4, .03, .06);
      if(pct>=100){
        clearInterval(timer);
        setTimeout(printTicket, 250);
      }
    }, stepMs);
  }

  /* ---------------- ticket + monitor ---------------- */
  function printTicket(){
    state = S.TICKET;
    sPrint();
    stage.innerHTML = `
      <div class="stage-title">บัตรคิวผู้ป่วย</div>
      <div id="ticket">
        <div class="t-title">ANIMAL HOSPITAL</div>
        <div class="t-row"><span>ชื่อสัตว์ป่วย</span><span>${currentPatient.name}</span></div>
        <div class="t-row"><span>สายพันธุ์</span><span>${currentPatient.species.th}</span></div>
        <div class="t-row"><span>อาการ</span><span></span></div>
        <div style="margin:-2px 0 6px;color:#5a4d38;">${currentPatient.symptom}</div>
        <div class="t-queue">คิว ${String(currentPatient.queue).padStart(3,'0')}</div>
        <div class="t-row"><span>เจ้าหน้าที่</span><span>${staffName}</span></div>
        <div class="t-foot">*** โปรดรอเรียกคิวที่จอ MONITOR ***</div>
      </div>
    `;
    requestAnimationFrame(()=>{
      document.getElementById('ticket').classList.add('printed');
    });
    updateMonitor(currentPatient);
    setTimeout(showCareItems, 1800);
    queueNum++;
  }

  function showCareItems(){
    state = S.CARE_ITEMS;
    stage.innerHTML = `
      <div class="stage-title">รายการสิ่งที่ต้องเตรียม</div>
      <div id="care-items-box">
        <div class="care-patient">
          <div class="care-name">${currentPatient.name}</div>
          <div class="care-species">${currentPatient.species.th}</div>
        </div>
        <div class="care-items-list">
          <div class="item-header">ต้องการ:</div>
          <div class="item-text">${currentPatient.need}</div>
        </div>
      </div>
    `;
    setHint(`กด <span class="keycap" id="kc1">Space</span> เพื่อเริ่มรักษา / รับเคสถัดไป`);
  }

  function updateMonitor(p){
    monitorScreen.innerHTML = `
      <div class="mline">คิวเรียก</div>
      <div class="mval">${String(p.queue).padStart(3,'0')} — ${p.name} (${p.species.th})</div>
      <div class="mline">อาการเบื้องต้น</div>
      <div class="mval" style="font-size:12.5px;font-weight:500;color:#8be8c4;">${p.symptom}</div>
      <div class="monitor-need">
        <div class="mlabel">สิ่งที่ต้องการ</div>
        <div class="mtext blinker">ต้องการ: ${p.need}</div>
      </div>
      <div class="mline" style="margin-top:14px;">ผู้ดูแลเคส: <span style="color:var(--monitor-green)">${staffName}</span></div>
    `;
  }

  /* ---------------- master input handler ---------------- */
  function nextStep(){
    if(busy) return;
    switch(state){
      case S.MAIN: busy=true; doStamp(); busy=false; break;
      case S.STAMPED: busy=true; doSign(); busy=false; break;
      case S.SIGNED: busy=true; openCamera(); busy=false; break;
      case S.CAMERA: busy=true; capturePhoto(); busy=false; break;
      case S.CAPTURED: busy=true; startProcessing(); busy=false; break;
      case S.TICKET: busy=true; goMain(); busy=false; break;
      case S.CARE_ITEMS: busy=true; goMain(); busy=false; break;
      default: break;
    }
  }

  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space'){
      e.preventDefault();
      if(state===S.LOGIN){ return; }
      sKeyClick();
      nextStep();
    }
  });

})();
</script>
</body>
</html>
